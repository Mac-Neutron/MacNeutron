[workspace]
resolver = "2"
members = [
    "vm/host",
    "crates/macneutron-core",
    "crates/macneutron-cli",
    "crates/macneutron-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
