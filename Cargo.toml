[workspace]
resolver = "2"
members = [
    "vm/host",
    "crates/macneutron-core",
    "crates/macneutron-cli",
    "crates/macneutron-app",
    "crates/macneutron-installer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"
# AppKit for the toast, Steam's quit request and Install MacNeutron (DXMTRS is on the same objc2 0.6 line).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
opt-level = 3
