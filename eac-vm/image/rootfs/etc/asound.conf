# The default device is the Mac's sound: ALSA's mn plugin (eac-vm/guest/alsa-mn.c for Wine under FEX, in the share's
# bin/lib64 for x86-64 and bin/lib for i686, old WoW64's 32-bit Unix side: the dynamic loader expands $LIB to the
# process's own; from eac-vm/guest/build-audio.sh) streams to the VM host's CoreAudio player over vsock.
# Without the host it plays into nothing at the stream's rate, as the null device did: games such as SMITE 2 crash on
# a mastering voice that could not be created.
pcm_type.mn {
  lib "/mnt/share/bin/$LIB/libasound_module_pcm_mn.so"
}
pcm.!default {
  type mn
}
