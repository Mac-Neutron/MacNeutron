# The default device is the Mac's sound: ALSA's mn plugin (eac-vm/guest/alsa-mn.c, x86-64 for Wine under FEX; in the
# share's bin/ beside mn-input, from eac-vm/guest/build-audio.sh) streams to the VM host's CoreAudio player over vsock.
# Without the host it plays into nothing at the stream's rate, as the null device did: games such as SMITE 2 crash on
# a mastering voice that could not be created.
pcm_type.mn {
  lib "/mnt/share/bin/libasound_module_pcm_mn.so"
}
pcm.!default {
  type mn
}
