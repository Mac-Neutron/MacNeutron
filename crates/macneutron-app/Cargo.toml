[package]
name = "macneutron-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "macneutron_app"
path = "src/lib.rs"

# The menu-bar app; the Makefile copies it to MacNeutron.app/Contents/MacOS/MacNeutron (CFBundleExecutable).
[[bin]]
name = "MacNeutronApp"
path = "src/main.rs"

[dependencies]
macneutron-core = { path = "../macneutron-core" }
libc.workspace = true
plist.workspace = true
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation",
    "NSAlert", "NSApplication", "NSBox", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont",
    "NSFontDescriptor", "NSGraphics", "NSGridView", "NSImage", "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint",
    "NSMenu", "NSMenuItem", "NSPopUpButton", "NSProgressIndicator", "NSResponder", "NSRunningApplication",
    "NSScrollView", "NSSearchField", "NSSearchToolbarItem", "NSStackView", "NSStatusBar", "NSStatusBarButton",
    "NSStatusItem", "NSSwitch", "NSTableColumn", "NSTableView", "NSText", "NSTextField", "NSTextFieldCell", "NSToolbar",
    "NSToolbarItem", "NSUserInterfaceLayout", "NSView", "NSWindow", "NSWorkspace", "NSBitmapImageRep", "NSImageRep",
    "NSClipView", "NSActionCell", "NSUserInterfaceItemIdentification", "NSAccessibilityProtocols", "NSAppearance",
] }
objc2-service-management = "0.3.2"
dispatch2 = "0.3.1"
block2 = "0.6.2"

[dev-dependencies]
macneutron-core = { path = "../macneutron-core", features = ["test-support"] }
